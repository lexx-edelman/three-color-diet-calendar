<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>Мои дни</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#202124;--muted:#8a8a8a;--border:#e7e7e5;--g:#7fc98a;--y:#f4cf65;--r:#e98b88}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(100%,620px);margin:auto;padding:22px 14px 34px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:23px;margin:0;font-weight:700}.month-nav{display:flex;align-items:center;gap:7px}
button{font:inherit;border:0;color:inherit}.nav{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--border);font-size:22px}
.month{min-width:130px;text-align:center;font-weight:650}
.calendar{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:12px;box-shadow:0 3px 16px #00000009;touch-action:pan-y}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekdays{margin-bottom:6px}
.weekday{text-align:center;color:var(--muted);font-size:12px;padding:5px 0;font-weight:600}
.day{aspect-ratio:1;border-radius:13px;background:#fafafa;border:1px solid transparent;position:relative;font-size:15px;transition:transform .08s}
.day:active{transform:scale(.93)}.day.empty{background:transparent}.day.future{color:#c9c9c9;cursor:default}
.day.today{border:2px solid #777}.day.green{background:var(--g)}.day.yellow{background:var(--y)}.day.red{background:var(--r)}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.legend{display:flex;justify-content:center;gap:17px;margin-top:18px;color:#555;font-size:13px}.legend span{display:flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:4px}.gd{background:var(--g)}.yd{background:var(--y)}.rd{background:var(--r)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}.reset{display:block;margin:18px auto 0;color:#888;font-size:12px;text-decoration:underline;text-underline-offset:3px;background:none}
@media(max-width:420px){.app{padding-top:16px}.calendar{padding:9px}.weekdays,.days{gap:5px}.day{border-radius:11px}}
.tabs{display:flex;background:#ecece9;border-radius:13px;padding:3px;margin-bottom:16px}.tab{flex:1;padding:9px 6px;border-radius:10px;background:transparent;color:#777;font-weight:650;font-size:14px}.tab.active{background:#fff;color:#202124;box-shadow:0 1px 4px #0000000b}.mode-note{text-align:center;color:#8a8a8a;font-size:12px;margin-top:12px}</style>
</head>
<body>
<div class="app">
<div class="tabs"><button class="tab active" id="foodTab">Питание</button><button class="tab" id="sportTab">Спорт</button><button class="tab" id="hairTab">Уход за волосами</button></div>
<header><h1 id="modeTitle">Питание</h1><div class="month-nav"><button class="nav" id="prev">‹</button><div class="month" id="title"></div><button class="nav" id="next">›</button></div></header>
<main class="calendar" id="calendar">
<div class="weekdays"><div class="weekday">Пн</div><div class="weekday">Вт</div><div class="weekday">Ср</div><div class="weekday">Чт</div><div class="weekday">Пт</div><div class="weekday">Сб</div><div class="weekday">Вс</div></div>
<div class="days" id="days"></div>
</main>
<div id="foodInfo"><div class="legend"><span><i class="dot gd"></i> здоровое</span><span><i class="dot yd"></i> среднее</span><span><i class="dot rd"></i> много / сладкое</span></div><div class="hint">Оцени питание за день: 🟢 → 🟡 → 🔴 → без отметки</div></div><div id="sportInfo" style="display:none"><div class="legend"><span><i class="dot gd"></i> был в спортзале</span></div><div class="mode-note">Нажми на прошедший день, чтобы отметить тренировку</div></div>
<div id="hairInfo" style="display:none"><div class="legend"><span><i class="dot gd"></i> был уход</span></div><div class="mode-note">Нажми на прошедший день, чтобы отметить уход</div></div>
<button class="reset" id="reset">Сбросить все отметки</button>
</div>
<script>
const KEY="food-sport-calendar-v4",colors=["green","yellow","red"],names=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const saved=JSON.parse(localStorage.getItem(KEY)||"{}"),data=saved.food||{},sport=saved.sport||{},now=new Date();let y=now.getFullYear(),m=now.getMonth(),mode="food";
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function save(){localStorage.setItem(KEY,JSON.stringify({food:data,sport,hair}))}
function render(){title.textContent=`${names[m]} ${y}`;days.innerHTML="";const first=new Date(y,m,1),count=new Date(y,m+1,0).getDate(),offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++){let e=document.createElement("div");e.className="day empty";days.append(e)}const current=mode==="food"?data:(mode==="sport"?sport:hair);for(let d=1;d<=count;d++){const dt=new Date(y,m,d),k=key(y,m,d),b=document.createElement("button");b.className="day";if(dt>now&&dt.toDateString()!==now.toDateString()){b.classList.add("future");b.disabled=true}if(dt.toDateString()===now.toDateString())b.classList.add("today");if(current[k])b.classList.add(mode==="food"?current[k]:"green");b.innerHTML=`<span class="num">${d}</span>`;b.onclick=()=>{if(mode==="food"){let c=data[k];if(!c)data[k]=colors[0];else if(c===colors[0])data[k]=colors[1];else if(c===colors[1])data[k]=colors[2];else delete data[k]}else if(mode==="sport"){if(sport[k])delete sport[k];else sport[k]=true}else{if(hair[k])delete hair[k];else hair[k]=true}save();render()};days.append(b)}}
function setMode(next){mode=next;foodTab.classList.toggle("active",mode==="food");sportTab.classList.toggle("active",mode==="sport");hairTab.classList.toggle("active",mode==="hair");modeTitle.textContent=mode==="food"?"Питание":(mode==="sport"?"Спорт":"Уход за волосами");foodInfo.style.display=mode==="food"?"block":"none";sportInfo.style.display=mode==="sport"?"block":"none";hairInfo.style.display=mode==="hair"?"block":"none";render()}
foodTab.onclick=()=>setMode("food");sportTab.onclick=()=>setMode("sport");hairTab.onclick=()=>setMode("hair");prev.onclick=()=>{m--;if(m<0){m=11;y--}render()};next.onclick=()=>{m++;if(m>11){m=0;y++}render()};reset.onclick=()=>{if(confirm(mode==="food"?"Удалить все отметки о питании?":(mode==="sport"?"Удалить все отметки о спортзале?":"Удалить все отметки об уходе за волосами?"))){const obj=mode==="food"?data:(mode==="sport"?sport:hair);Object.keys(obj).forEach(k=>delete obj[k]);save();render()}};let sx=0;calendar.addEventListener("touchstart",e=>sx=e.changedTouches[0].screenX,{passive:true});calendar.addEventListener("touchend",e=>{let dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>70){dx<0?next.click():prev.click()}},{passive:true});render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
